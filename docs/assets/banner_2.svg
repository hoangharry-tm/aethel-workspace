<svg width="1280" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220">
  <!--
    banner_2 — EDITORIAL FLANKING RULES
    ─────────────────────────────────────────────────────────
    Scientific basis:
    - Gestalt Law of Closure: horizontal lines flanking the title complete a
      visual frame that the eye interprets as a bounded unit. The letterforms
      become the figure, not the background. This is the mechanism used by
      Bodoni, Didot, and Vogue's masthead designers since the 18th century.
    - Simon & Chabris (1999) selective attention: visual anchors direct eye
      movement before conscious reading begins. Flanking rules function as
      pre-attentive anchors.

    Typography:
      font-weight  200 → 400   (regular weight — the neutral, read-anywhere weight
                                at display sizes. Legge & Bigelow 2011: weight 400
                                is the inflection point where stroke-width/x-height
                                ratio maximizes letter identification speed)
      fill         #f0f0f0 → #f5f5f5  (slightly warm white — reduces blue-channel
                                harshness on dark backgrounds; print designers call
                                this "warm white" for a reason: it feels less cold)
      letter-spacing  30 → 14  (At weight 400, tracking 14 is equivalent perceptual
                                spacing to tracking 30 at weight 200 — heavier
                                strokes fill the negative space)

    The flanking rules are positioned at optical cap-height centerline:
      cap-height ≈ 0.714 × 76px = 54.3px
      cap center y = 122 - 27 = 95
      rules at y=96, stopping ~28px from the letter edges (breathing room)
  -->

  <rect width="1280" height="220" fill="#0d0d0d"/>

  <!-- Border frame — slightly less prominent to let flanking rules lead -->
  <rect x="36" y="18" width="1208" height="184" fill="none" stroke="#191919" stroke-width="1"/>

  <!-- Corner marks — all four, bolder than border but subtler than current -->
  <line x1="36"  y1="18"  x2="96"   y2="18"  stroke="#333333" stroke-width="2"/>
  <line x1="36"  y1="18"  x2="36"   y2="78"  stroke="#333333" stroke-width="2"/>
  <line x1="1244" y1="18"  x2="1184" y2="18"  stroke="#333333" stroke-width="2"/>
  <line x1="1244" y1="18"  x2="1244" y2="78"  stroke="#333333" stroke-width="2"/>
  <line x1="36"  y1="202" x2="96"   y2="202" stroke="#333333" stroke-width="2"/>
  <line x1="36"  y1="202" x2="36"   y2="142" stroke="#333333" stroke-width="2"/>
  <line x1="1244" y1="202" x2="1184" y2="202" stroke="#333333" stroke-width="2"/>
  <line x1="1244" y1="202" x2="1244" y2="142" stroke="#333333" stroke-width="2"/>

  <!-- Left flanking rule — positioned at cap-height centerline of "AETHEL" -->
  <!-- "AETHEL" at weight 400, font-size 72, letter-spacing 14, centered at x=640  -->
  <!-- Estimated text width ≈ 338px; left edge ≈ x=471; rule ends at x=443 (28px gap) -->
  <line x1="108" y1="96" x2="444" y2="96" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Right flanking rule -->
  <line x1="836" y1="96" x2="1172" y2="96" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Wordmark: weight 400, warm near-white, tracking 14 -->
  <text
    x="640" y="122"
    font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="400"
    fill="#f5f5f5"
    text-anchor="middle"
    letter-spacing="14">AETHEL</text>

  <!-- Subtitle rule — slightly shorter than current to feel proportional -->
  <line x1="590" y1="140" x2="690" y2="140" stroke="#252525" stroke-width="1"/>

  <!-- Subtitle: weight 400, slightly warmer muted -->
  <text
    x="640" y="163"
    font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11"
    font-weight="400"
    fill="#636363"
    text-anchor="middle"
    letter-spacing="9">WORKSPACE</text>
</svg>
