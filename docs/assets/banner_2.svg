<svg width="1280" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220">
  <!--
    banner_2 — WARM GRAPHITE + AGED CREAM
    ─────────────────────────────────────────────────────────
    Research basis:
    Kapferer & Bastien "The Luxury Strategy" (2012): warm near-black + aged cream
    is the dominant print palette of legacy luxury houses — Chanel No. 5
    packaging, Prada catalogues, Hermès tissue paper. The warmth (added
    red-yellow component to the neutral black) is a subconcious signal of
    physicality and permanence: printed matter ages warm, screens are cold.

    Color science:
    Background #100e0b — near-black with a warm cast (hue ≈ 34°, very dark
    amber). Compared to neutral #0a0a0a, this reads as "ink on paper" rather
    than "LCD backlight." The warm undertone creates a color temperature contrast
    with the cool-gray original background that is immediately perceptible.

    Wordmark #f5e9d6 — aged cream / warm white (parchment tone, hue ≈ 36°).
    This is NOT pure white: it is the color of uncoated luxury stock paper.
    Against the warm-dark background, this cream reads more brilliantly than
    pure white would — because the two warm tones share a hue, Josef Albers'
    simultaneous contrast rule predicts higher perceived brightness for a warm
    figure on a warm ground than a cool figure (pure white) on a warm ground.

    Practical effect: the thin letterforms of weight-200 appear more substantial
    because the warm tones "hold together" — no blue-channel separation pulling
    the strokes apart visually.

    Corner marks #2e2520 — warm dark brown, visible without being distracting.
    Subtitle #5c4a38 — warm muted brown, cohesive with the palette.
  -->

  <rect width="1280" height="220" fill="#100e0b"/>

  <!-- Border frame — warm dark -->
  <rect x="36" y="18" width="1208" height="184" fill="none" stroke="#1e1a16" stroke-width="1"/>

  <!-- Corner marks — top-left -->
  <line x1="36"   y1="18"  x2="90"   y2="18"  stroke="#2e2520" stroke-width="1.5"/>
  <line x1="36"   y1="18"  x2="36"   y2="72"  stroke="#2e2520" stroke-width="1.5"/>
  <!-- Corner marks — top-right -->
  <line x1="1244" y1="18"  x2="1190" y2="18"  stroke="#2e2520" stroke-width="1.5"/>
  <line x1="1244" y1="18"  x2="1244" y2="72"  stroke="#2e2520" stroke-width="1.5"/>
  <!-- Corner marks — bottom-left -->
  <line x1="36"   y1="202" x2="90"   y2="202" stroke="#2e2520" stroke-width="1.5"/>
  <line x1="36"   y1="202" x2="36"   y2="148" stroke="#2e2520" stroke-width="1.5"/>
  <!-- Corner marks — bottom-right -->
  <line x1="1244" y1="202" x2="1190" y2="202" stroke="#2e2520" stroke-width="1.5"/>
  <line x1="1244" y1="202" x2="1244" y2="148" stroke="#2e2520" stroke-width="1.5"/>

  <!-- Wordmark — aged cream / warm parchment -->
  <text
    x="640" y="122"
    font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="76"
    font-weight="200"
    fill="#f5e9d6"
    text-anchor="middle"
    letter-spacing="30">AETHEL</text>

  <!-- Accent rule — warm dark -->
  <line x1="574" y1="142" x2="706" y2="142" stroke="#302820" stroke-width="1"/>

  <!-- Subtitle — warm muted brown -->
  <text
    x="640" y="168"
    font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12"
    font-weight="400"
    fill="#5c4a38"
    text-anchor="middle"
    letter-spacing="10">WORKSPACE</text>
</svg>
