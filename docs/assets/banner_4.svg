<svg width="1280" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220">
  <!--
    banner_4 — DEEP INDIGO MONOCHROMATIC (Brand-Coherent)
    ─────────────────────────────────────────────────────────
    Research basis:
    Brand color coherence theory (Wheeler "Designing Brand Identity", 2013):
    when a brand's primary accent color (#4f46e5 in Aethel's case) appears in
    its darkened form as the dominant banner background, it creates subconscious
    color memory — viewers who have used the application recognize the indigo
    hue and connect it to their experience. This is the mechanism behind Google's
    use of blue across all surfaces: the exact hue, at any value, triggers recall.

    Color science:
    Background #0c0b1e — near-black with a strong purple-blue cast, a very dark
    desaturated version of #4f46e5 (the application's --ui-primary color). The
    hue is identical (≈248°) but the value (lightness) is reduced to ~7%,
    making it a dark companion to the brand color without the aggressive
    saturation of the full #4f46e5.

    Wordmark #ffffff — pure white. Against a cool-dark indigo background,
    pure white creates the blue-channel simultaneous contrast effect: the
    cool background makes the neutral white appear slightly warm and luminous
    by comparison. This is the inverse of warm colors making whites look cold.
    At weight-200, the thin letterforms benefit from this maximum 21:1 contrast
    (WCAG; luminance ratio).

    Corner marks #1a1840 — dark indigo, matches the hue family.
    Subtitle #3d3870 — muted mid-indigo, clearly a sibling of the bg hue.

    Accent rule — slightly brighter indigo (#272454) to be just barely visible.

    Practical effect: when this banner appears at the top of the GitHub README,
    the indigo bg immediately signals "this is the Aethel brand" to anyone
    who has seen the UI — the banner and the app share a color DNA.
  -->

  <rect width="1280" height="220" fill="#0c0b1e"/>

  <!-- Border frame — dark indigo -->
  <rect x="36" y="18" width="1208" height="184" fill="none" stroke="#141230" stroke-width="1"/>

  <!-- Corner marks — top-left -->
  <line x1="36"   y1="18"  x2="90"   y2="18"  stroke="#1e1c40" stroke-width="1.5"/>
  <line x1="36"   y1="18"  x2="36"   y2="72"  stroke="#1e1c40" stroke-width="1.5"/>
  <!-- Corner marks — top-right -->
  <line x1="1244" y1="18"  x2="1190" y2="18"  stroke="#1e1c40" stroke-width="1.5"/>
  <line x1="1244" y1="18"  x2="1244" y2="72"  stroke="#1e1c40" stroke-width="1.5"/>
  <!-- Corner marks — bottom-left -->
  <line x1="36"   y1="202" x2="90"   y2="202" stroke="#1e1c40" stroke-width="1.5"/>
  <line x1="36"   y1="202" x2="36"   y2="148" stroke="#1e1c40" stroke-width="1.5"/>
  <!-- Corner marks — bottom-right -->
  <line x1="1244" y1="202" x2="1190" y2="202" stroke="#1e1c40" stroke-width="1.5"/>
  <line x1="1244" y1="202" x2="1244" y2="148" stroke="#1e1c40" stroke-width="1.5"/>

  <!-- Wordmark — pure white, maximum contrast against indigo field -->
  <text
    x="640" y="122"
    font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="76"
    font-weight="200"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="30">AETHEL</text>

  <!-- Accent rule — slightly brighter indigo, barely perceptible -->
  <line x1="574" y1="142" x2="706" y2="142" stroke="#272454" stroke-width="1"/>

  <!-- Subtitle — muted mid-indigo, clearly a sibling of the bg -->
  <text
    x="640" y="168"
    font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12"
    font-weight="400"
    fill="#4a4680"
    text-anchor="middle"
    letter-spacing="10">WORKSPACE</text>
</svg>
