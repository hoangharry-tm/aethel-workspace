<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <!-- Background -->
  <rect width="900" height="300" fill="#ffffff"/>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrow-default" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-escalated" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-rejected" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrow-attempted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Happy path nodes (y=140 baseline center) -->
  <!-- PENDING_ASSIGNMENT: x=50, y=115, w=140, h=50 -->
  <rect x="30" y="115" width="148" height="50" rx="8" ry="8" fill="#94a3b8"/>
  <text x="104" y="136" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">PENDING</text>
  <text x="104" y="152" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">ASSIGNMENT</text>

  <!-- Arrow: PENDING → UNDER_REVIEW -->
  <line x1="178" y1="140" x2="226" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-default)"/>

  <!-- UNDER_REVIEW: x=228, y=115, w=140, h=50 -->
  <rect x="228" y="115" width="140" height="50" rx="8" ry="8" fill="#6366f1"/>
  <text x="298" y="136" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">UNDER</text>
  <text x="298" y="152" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">REVIEW</text>

  <!-- Arrow: UNDER_REVIEW → IN_TRANSIT -->
  <line x1="368" y1="140" x2="418" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-default)"/>

  <!-- IN_TRANSIT: x=420, y=115, w=118, h=50 -->
  <rect x="420" y="115" width="120" height="50" rx="8" ry="8" fill="#0ea5e9"/>
  <text x="480" y="136" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">IN</text>
  <text x="480" y="152" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">TRANSIT</text>

  <!-- Arrow: IN_TRANSIT → DELIVERED -->
  <line x1="540" y1="140" x2="590" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-default)"/>

  <!-- DELIVERED: x=592, y=115, w=110, h=50 -->
  <rect x="592" y="115" width="116" height="50" rx="8" ry="8" fill="#10b981"/>
  <text x="650" y="144" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">DELIVERED</text>

  <!-- Branch: UNDER_REVIEW → ESCALATED (upward) -->
  <!-- Vertical line up from UNDER_REVIEW center top -->
  <line x1="298" y1="115" x2="298" y2="62" stroke="#f43f5e" stroke-width="1.5"/>
  <!-- Horizontal line to ESCALATED x center -->
  <line x1="298" y1="62" x2="756" y2="62" stroke="#f43f5e" stroke-width="1.5"/>
  <!-- Vertical line down to ESCALATED -->
  <line x1="756" y1="62" x2="756" y2="85" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrow-escalated)"/>

  <!-- ESCALATED node -->
  <rect x="708" y="32" width="120" height="50" rx="8" ry="8" fill="#f43f5e"/>
  <text x="768" y="62" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">ESCALATED</text>

  <!-- Label "threshold exceeded" above the horizontal line -->
  <text x="530" y="56" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#f43f5e">threshold exceeded</text>

  <!-- Branch: UNDER_REVIEW → REJECTED (downward) -->
  <!-- Vertical line down from UNDER_REVIEW center bottom -->
  <line x1="298" y1="165" x2="298" y2="225" stroke="#ef4444" stroke-width="1.5"/>
  <!-- Horizontal line right to REJECTED x center -->
  <line x1="298" y1="225" x2="756" y2="225" stroke="#ef4444" stroke-width="1.5"/>
  <!-- Vertical line up to REJECTED -->
  <line x1="756" y1="225" x2="756" y2="215" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-rejected)"/>

  <!-- REJECTED node -->
  <rect x="708" y="190" width="120" height="50" rx="8" ry="8" fill="#ef4444"/>
  <text x="768" y="220" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">REJECTED</text>

  <!-- Label "admin action" below the horizontal line -->
  <text x="530" y="244" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#ef4444">admin action</text>

  <!-- Branch: IN_TRANSIT → ATTEMPTED_DELIVERY (downward, separate) -->
  <!-- Line from IN_TRANSIT bottom center downward -->
  <line x1="480" y1="165" x2="480" y2="255" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Horizontal line right to ATTEMPTED center -->
  <line x1="480" y1="255" x2="650" y2="255" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-attempted)"/>

  <!-- ATTEMPTED_DELIVERY node -->
  <rect x="592" y="233" width="130" height="44" rx="8" ry="8" fill="#f59e0b"/>
  <text x="657" y="251" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#ffffff">ATTEMPTED</text>
  <text x="657" y="266" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#ffffff">DELIVERY</text>

  <!-- Label "no recipient" on downward line -->
  <text x="498" y="218" text-anchor="start" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#f59e0b">no recipient</text>

  <!-- Title label -->
  <text x="450" y="22" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">Dispatch Status State Machine</text>
</svg>
