<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <!-- Background -->
  <rect width="900" height="200" fill="#ffffff"/>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="chain-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f46e5"/>
    </marker>
    <marker id="tamper-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Card dimensions: w=180, h=128, card-gap=30 -->
  <!-- Cards centered vertically in 200px: top = (200 - 128) / 2 = 36 -->
  <!-- Card 1: x=20 -->
  <!-- Card 2: x=20+180+30=230 -->
  <!-- Card 3: x=230+180+30=440 -->
  <!-- Card 4: x=440+180+30=650 -->

  <!-- NOTE 1 -->
  <rect x="20" y="30" width="180" height="128" rx="6" ry="6" fill="#1e293b"/>
  <!-- Top section label bar -->
  <rect x="20" y="30" width="180" height="28" rx="6" ry="6" fill="#334155"/>
  <rect x="20" y="44" width="180" height="14" fill="#334155"/>
  <text x="110" y="49" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Note #1</text>
  <!-- Content area -->
  <text x="30" y="80" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">Received from</text>
  <text x="30" y="94" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">Ministry of Finance</text>
  <text x="30" y="108" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">Assigned to Dept A</text>
  <!-- Hash section -->
  <rect x="20" y="120" width="180" height="38" rx="0" ry="0" fill="#0f172a"/>
  <rect x="20" y="144" width="180" height="14" rx="0" ry="6" fill="#0f172a"/>
  <text x="30" y="134" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">hash</text>
  <text x="100" y="134" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#4f46e5">7e2a...c841</text>
  <text x="30" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">prev</text>
  <text x="100" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#475569">— (genesis)</text>

  <!-- Arrow 1 → 2 -->
  <line x1="200" y1="139" x2="228" y2="139" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#chain-arrow)"/>

  <!-- NOTE 2 -->
  <rect x="230" y="30" width="180" height="128" rx="6" ry="6" fill="#1e293b"/>
  <rect x="230" y="30" width="180" height="28" rx="6" ry="6" fill="#334155"/>
  <rect x="230" y="44" width="180" height="14" fill="#334155"/>
  <text x="320" y="49" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Note #2</text>
  <text x="240" y="80" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">Under review by</text>
  <text x="240" y="94" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">Director Nguyen</text>
  <text x="240" y="108" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">Approval pending</text>
  <rect x="230" y="120" width="180" height="38" rx="0" ry="0" fill="#0f172a"/>
  <rect x="230" y="144" width="180" height="14" rx="0" ry="6" fill="#0f172a"/>
  <text x="240" y="134" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">hash</text>
  <text x="310" y="134" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#4f46e5">a3f9...b72c</text>
  <text x="240" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">prev</text>
  <text x="310" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#4f46e5">7e2a...c841</text>

  <!-- Arrow 2 → 3 -->
  <line x1="410" y1="139" x2="438" y2="139" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#tamper-arrow)"/>

  <!-- NOTE 3 — TAMPERED -->
  <rect x="440" y="30" width="180" height="128" rx="6" ry="6" fill="#1e293b"/>
  <rect x="440" y="30" width="180" height="28" rx="6" ry="6" fill="#3f1515"/>
  <rect x="440" y="44" width="180" height="14" fill="#3f1515"/>
  <text x="530" y="49" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Note #3</text>
  <!-- Tamper detected annotation above card -->
  <rect x="448" y="6" width="165" height="20" rx="3" ry="3" fill="#ef4444"/>
  <text x="530" y="20" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">TAMPER DETECTED</text>
  <!-- Red outline on tampered card -->
  <rect x="440" y="30" width="180" height="128" rx="6" ry="6" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="80" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#fca5a5">Content altered —</text>
  <text x="450" y="94" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#fca5a5">unauthorized edit</text>
  <text x="450" y="108" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#fca5a5">detected at verify</text>
  <rect x="440" y="120" width="180" height="38" rx="0" ry="0" fill="#1a0a0a"/>
  <rect x="440" y="144" width="180" height="14" rx="0" ry="6" fill="#1a0a0a"/>
  <text x="450" y="134" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">hash</text>
  <text x="520" y="134" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#ef4444">9x1c...XXXX</text>
  <text x="450" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">prev</text>
  <text x="520" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#ef4444">a3f9...b72c</text>

  <!-- Arrow 3 → 4 (broken) -->
  <line x1="620" y1="139" x2="648" y2="139" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#tamper-arrow)"/>

  <!-- NOTE 4 -->
  <rect x="650" y="30" width="180" height="128" rx="6" ry="6" fill="#1e293b"/>
  <rect x="650" y="30" width="180" height="28" rx="6" ry="6" fill="#334155"/>
  <rect x="650" y="44" width="180" height="14" fill="#334155"/>
  <text x="740" y="49" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Note #4</text>
  <text x="660" y="80" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">Approved and</text>
  <text x="660" y="94" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">signed by Director</text>
  <text x="660" y="108" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">Dispatched 09:41</text>
  <rect x="650" y="120" width="180" height="38" rx="0" ry="0" fill="#0f172a"/>
  <rect x="650" y="144" width="180" height="14" rx="0" ry="6" fill="#0f172a"/>
  <text x="660" y="134" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">hash</text>
  <text x="730" y="134" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#4f46e5">f81d...3e90</text>
  <text x="660" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">prev</text>
  <!-- prev_hash will mismatch against note 3's real hash -->
  <text x="730" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#ef4444">9x1c...XXXX</text>

  <!-- Title -->
  <text x="450" y="188" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">Green Note cryptographic chain · SHA-256(content ‖ seq ‖ author ‖ prev_hash)</text>
</svg>
