<svg width="1280" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220">
  <!--
    banner_3 — FOREST GREEN MONOCHROMATIC
    ─────────────────────────────────────────────────────────
    Research basis:
    Elliot & Maier (2012) "Color and Psychological Functioning": deep green
    signals stability, growth, and trustworthiness — but it is dramatically
    underused in enterprise software (dominated by blue, gray, black), which
    creates strong distinctiveness value.

    Premium green associations in branding: Rolex (British racing green),
    Hermès secondary palette, John Deere (longevity + reliability), Bottega
    Veneta (dark forest green as "the new black" in luxury fashion 2019–2023).

    Color science:
    Background #080f0a — near-black with a definite green cast (hue ≈ 138°).
    The green undertone creates the strongest chromatic contrast with the
    near-white wordmark of any of the four variants, because green and white
    have the maximum simultaneous contrast on the opponent-process channel
    (red-green axis in the human visual system — Hering's opponent color theory,
    1878). This means: even at font-weight 200, the thin letterforms benefit
    from the green-vs-white chromatic signal that the neutral black background
    entirely lacks.

    Wordmark #d8ede2 — very light mint (hue ≈ 148°, same hue family as bg).
    Albers' rule: monochromatic pairing (same hue, extreme value difference)
    produces high clarity with zero harshness. Pure white (#ffffff) against
    this green bg would create a slight "vibration" at the stroke edges
    (complementary color illusion); the mint-tinted white eliminates it.

    This palette is the highest-contrast variant from a chromatic standpoint,
    which is exactly why it helps weight-200 letterforms most.
  -->

  <rect width="1280" height="220" fill="#080f0a"/>

  <!-- Border frame — dark forest green -->
  <rect x="36" y="18" width="1208" height="184" fill="none" stroke="#101e12" stroke-width="1"/>

  <!-- Corner marks — top-left -->
  <line x1="36"   y1="18"  x2="90"   y2="18"  stroke="#172a1a" stroke-width="1.5"/>
  <line x1="36"   y1="18"  x2="36"   y2="72"  stroke="#172a1a" stroke-width="1.5"/>
  <!-- Corner marks — top-right -->
  <line x1="1244" y1="18"  x2="1190" y2="18"  stroke="#172a1a" stroke-width="1.5"/>
  <line x1="1244" y1="18"  x2="1244" y2="72"  stroke="#172a1a" stroke-width="1.5"/>
  <!-- Corner marks — bottom-left -->
  <line x1="36"   y1="202" x2="90"   y2="202" stroke="#172a1a" stroke-width="1.5"/>
  <line x1="36"   y1="202" x2="36"   y2="148" stroke="#172a1a" stroke-width="1.5"/>
  <!-- Corner marks — bottom-right -->
  <line x1="1244" y1="202" x2="1190" y2="202" stroke="#172a1a" stroke-width="1.5"/>
  <line x1="1244" y1="202" x2="1244" y2="148" stroke="#172a1a" stroke-width="1.5"/>

  <!-- Wordmark — very light mint, same hue family as background -->
  <text
    x="640" y="122"
    font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="76"
    font-weight="200"
    fill="#d8ede2"
    text-anchor="middle"
    letter-spacing="30">AETHEL</text>

  <!-- Accent rule — medium forest green -->
  <line x1="574" y1="142" x2="706" y2="142" stroke="#1c3320" stroke-width="1"/>

  <!-- Subtitle — muted medium green -->
  <text
    x="640" y="168"
    font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12"
    font-weight="400"
    fill="#3a6045"
    text-anchor="middle"
    letter-spacing="10">WORKSPACE</text>
</svg>
