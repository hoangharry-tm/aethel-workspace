openapi: "3.1.0"

info:
  title: Aethel Workspace API
  version: "1.0.0"
  description: |
    REST API for Aethel Workspace — an open-source, self-hosted e-office platform
    for institutional document workflows.

    ## Authentication

    All endpoints (except those marked **Public**) require a JWT access token:

    ```
    Authorization: Bearer <access_token>
    ```

    Obtain a token via `POST /api/v1/auth/login`. Tokens expire in **15 minutes**.
    Use `POST /api/v1/auth/refresh` to renew silently using the `refresh_token` httpOnly cookie.

    ## CSRF Protection

    State-changing requests (`POST`, `PATCH`, `PUT`, `DELETE`) from browser clients must
    include the CSRF token in a header:

    ```
    X-CSRF-Token: <value of the csrf_token cookie>
    ```

    The `csrf_token` cookie is set by the server on login. Non-browser clients (CLI, mobile)
    that do not send cookies are exempt from this requirement.

    ## Rate Limiting

    - **Global:** 600 requests/min per IP (unauthenticated)
    - **Per user:** 300 requests/min per authenticated user
    - **Login endpoint:** 20 requests/min per IP (credential-stuffing protection)

    Responses exceeding the limit receive `429 Too Many Requests` with a `Retry-After` header.

    ## Error Format

    All error responses use a consistent JSON envelope:
    ```json
    { "error": "human-readable description", "field": "fieldName (validation errors only)" }
    ```

  contact:
    name: Aethel Workspace
    url: https://github.com/hoangharry-tm/aethel-workspace

  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: "{scheme}://{host}/api/v1"
    description: Self-hosted deployment
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: your-domain.example.com
        description: Your server hostname

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: |
      Authentication and session management. Login, token refresh, logout,
      and password reset flows.
  - name: Config
    description: |
      Runtime configuration — branding, navigation structure, feature flags, and org profile.
      Read endpoints are available to all authenticated users. Write endpoints require ADMIN.
  - name: Dispatch
    description: |
      **Pillar 1 — DAK Diarization.** Inbound and outbound correspondence tracking.
      Includes receipt, routing, assignment, delivery acknowledgement, and attachments.
  - name: Workflow
    description: |
      **Pillar 2 — Green Noting Canvas.** Minute sheets and cryptographically-chained
      green notes. Each note is immutable after insert; the chain is verified on every append.
  - name: Governance
    description: |
      **Pillar 3 — RBAC Audit Ledger.** Append-only, monthly-partitioned, checksum-chained
      event log. Requires `SYS_ADMIN` role. Includes tamper-detection verification endpoint.
  - name: Admin
    description: |
      Administrative management — users, document types, routing rules, escalation rules,
      reports, and system settings. Requires ADMIN role.
  - name: Notifications
    description: |
      In-app notifications and real-time SSE stream. The SSE endpoint (`/notifications/stream`)
      delivers events to connected browser clients within 2 seconds of the triggering action.
  - name: System
    description: Health and readiness probes. No authentication required.

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      operationId: AuthLogin
      summary: Log in and receive tokens
      description: |
        Authenticates the user with email and password.
        On success, sets two cookies and returns the access token in the response body:
        - `refresh_token` — httpOnly; JavaScript cannot read this
        - `csrf_token` — readable; JavaScript must send this in `X-CSRF-Token` on subsequent requests

        **Account lockout:** After 5 consecutive failures, the account is locked for 15 minutes.
        The same `invalid credentials` error is returned regardless of whether the email exists
        (prevents user enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: "marcus.webb@ministry.gov"
              password: "S3cur3P@ssw0rd!"
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Sets `refresh_token` (httpOnly) and `csrf_token` (readable) cookies
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, role]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer, description: Seconds until expiry }
                  role: { $ref: '#/components/schemas/UserRole' }
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI4ZjNhMTJiYy0..."
                token_type: Bearer
                expires_in: 900
                role: RECEPTION
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid email or password (same response whether email exists or not)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invalid credentials" }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: AuthRefresh
      summary: Exchange refresh token for a new access token
      description: |
        Uses the `refresh_token` httpOnly cookie to issue a new access token and rotate
        the refresh token. The old refresh token is invalidated (token rotation).
        No request body required — the cookie is sent automatically by the browser.
      security: []
      responses:
        '200':
          description: New access token issued
          headers:
            Set-Cookie:
              description: New `refresh_token` and `csrf_token` cookies
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer }
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                expires_in: 900
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: AuthLogout
      summary: Revoke the current session
      description: |
        Invalidates the current refresh token and clears both cookies.
        The access token remains valid until its natural expiry (15 min max).
      responses:
        '204':
          description: Session revoked successfully
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: AuthPasswordResetRequest
      summary: Request a password reset email
      description: |
        Sends a password reset link to the provided email address.
        Always returns `202 Accepted` — does not reveal whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
            example:
              email: "marcus.webb@ministry.gov"
      responses:
        '202':
          description: Request accepted (email sent if account exists)
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: AuthPasswordResetConfirm
      summary: Apply a password reset token
      description: |
        Validates the one-time token and sets a new password.
        Tokens expire after 1 hour and are single-use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
            example:
              token: "abc123xyz..."
              newPassword: "N3wS3cur3P@ss!"
      responses:
        '204':
          description: Password reset successfully
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid or expired reset token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invalid or expired token" }

  # ── Config ────────────────────────────────────────────────────────────────────

  /config:
    get:
      tags: [Config]
      operationId: ConfigGet
      summary: Get full runtime configuration
      description: |
        Returns the complete org configuration — branding, navigation, feature flags,
        and org profile — from the in-memory config cache (5-min TTL).
        This is the primary endpoint for the Nuxt SSR frontend on page load.
      responses:
        '200':
          description: Full runtime configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }
              example:
                branding:
                  primaryColor: "#4f46e5"
                  neutralPalette: "slate"
                  fontFamily: "Inter"
                  logoUrl: null
                  wordmark: "Aethel Workspace"
                nav:
                  - label: "Reception"
                    roles: [RECEPTION, ADMIN]
                    items:
                      - label: "Dashboard"
                        icon: "i-lucide-layout-dashboard"
                        to: "/dashboard"
                        badge: null
                features:
                  greenNotingEnabled: false
                  externalSmtpEnabled: false
                  require2faForAdmin: false
                org:
                  name: "Ministry of Internal Affairs"
                  timezone: "Asia/Ho_Chi_Minh"
                  locale: "vi-VN"
                  contactEmail: "admin@ministry.gov.vn"
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config/branding:
    get:
      tags: [Config]
      operationId: ConfigGetBranding
      summary: Get branding configuration
      description: Returns only the branding sub-object from the config cache.
      responses:
        '200':
          description: Branding configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config/nav:
    get:
      tags: [Config]
      operationId: ConfigGetNav
      summary: Get navigation structure
      description: Returns the nav groups and items. Includes any runtime overrides stored in system_settings.
      responses:
        '200':
          description: Navigation structure
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NavGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config/features:
    get:
      tags: [Config]
      operationId: ConfigGetFeatures
      summary: Get feature flags
      description: Returns the feature flags configuration object.
      responses:
        '200':
          description: Feature flags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlags' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/config/branding:
    patch:
      tags: [Config]
      operationId: AdminConfigPatchBranding
      summary: Update branding configuration
      description: |
        Partially updates the branding configuration. All fields are optional.
        Invalidates the config cache so the next read reflects the new values.
        Requires ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchBrandingRequest' }
            example:
              primaryColor: "#0ea5e9"
              wordmark: "Ministry E-Office"
      responses:
        '200':
          description: Updated branding configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/config/nav:
    patch:
      tags: [Config]
      operationId: AdminConfigPatchNav
      summary: Update navigation structure
      description: |
        Replaces the runtime nav override stored in system_settings.
        The full nav array must be provided. Invalidates the config cache.
        Requires ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchNavRequest' }
      responses:
        '200':
          description: Updated navigation structure
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NavGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/config/features:
    patch:
      tags: [Config]
      operationId: AdminConfigPatchFeatures
      summary: Update feature flags
      description: |
        Partially updates feature flags. All fields are optional booleans.
        Invalidates the config cache. Requires ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchFeaturesRequest' }
            example:
              greenNotingEnabled: true
      responses:
        '200':
          description: Updated feature flags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlags' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/config/org:
    patch:
      tags: [Config]
      operationId: AdminConfigPatchOrg
      summary: Update org profile
      description: |
        Partially updates the organization profile. All fields are optional.
        Requires ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchOrgRequest' }
            example:
              name: "Ministry of Internal Affairs"
              timezone: "Asia/Ho_Chi_Minh"
      responses:
        '200':
          description: Updated org profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Dispatch ──────────────────────────────────────────────────────────────────

  /dispatches:
    get:
      tags: [Dispatch]
      operationId: DispatchListInbox
      summary: List inbound dispatch queue
      description: Returns the active inbound queue for the current user's department. Paginated.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of inbound dispatches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DispatchSummary' }
              example:
                data:
                  - id: "8f3a12bc-1234-5678-abcd-000000000001"
                    trackingNumber: "INB-2026-001234"
                    direction: INBOUND
                    senderName: "Tax Authority"
                    priorityLevel: PRIORITY
                    statusState: UNDER_REVIEW
                    createdAt: "2026-06-01T08:00:00Z"
                total: 42
                page: 1
                pageSize: 20
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Dispatch]
      operationId: DispatchCreate
      summary: Log a new inbound dispatch
      description: Creates a new inbound dispatch record. Triggers automatic routing rule evaluation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDispatchRequest' }
      responses:
        '201':
          description: Dispatch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /dispatches/outbound:
    get:
      tags: [Dispatch]
      operationId: DispatchListOutbound
      summary: List outbound dispatch queue
      description: Returns the outbound queue for the current organization. Paginated.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of outbound dispatches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DispatchSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Dispatch]
      operationId: DispatchCreateOutbound
      summary: Log a new outbound dispatch
      description: Creates a new outbound dispatch record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDispatchRequest' }
      responses:
        '201':
          description: Outbound dispatch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /my-dispatches:
    get:
      tags: [Dispatch]
      operationId: DispatchListMine
      summary: List dispatches assigned to me
      description: Returns all dispatches currently assigned to the authenticated user.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of the user's assigned dispatches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DispatchSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search:
    get:
      tags: [Dispatch]
      operationId: DispatchSearch
      summary: Full-text search across dispatches
      description: |
        Searches dispatch records by tracking number, sender name, subject line, or document type.
        Uses PostgreSQL full-text search (pg_trgm).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: Search query string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DispatchSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dispatches/{id}:
    get:
      tags: [Dispatch]
      operationId: DispatchGetByID
      summary: Get dispatch detail
      description: Returns the full dispatch record including the event timeline.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Full dispatch detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dispatches/{id}/status:
    patch:
      tags: [Dispatch]
      operationId: DispatchUpdateStatus
      summary: Update dispatch status
      description: Transitions the dispatch to a new status state. Logs a dispatch event.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/DispatchStatus' }
            example:
              status: IN_TRANSIT
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dispatches/{id}/assign:
    post:
      tags: [Dispatch]
      operationId: DispatchAssign
      summary: Assign dispatch to a user or department
      description: |
        Manually assigns the dispatch to a specific user or department.
        Sets `isManuallyRouted = true`, bypassing the automatic routing rules.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignDispatchRequest' }
            example:
              userId: "8f3a12bc-1234-5678-abcd-000000000042"
              isManualOverride: true
      responses:
        '200':
          description: Dispatch assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dispatches/{id}/acknowledge:
    post:
      tags: [Dispatch]
      operationId: DispatchAcknowledge
      summary: Record receipt acknowledgement
      description: |
        Records that the recipient has acknowledged receipt of the dispatch.
        Sets `acknowledgedAt` and `acknowledgedByUserId` on the dispatch record.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Acknowledgement recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dispatches/{id}/attachments:
    get:
      tags: [Dispatch]
      operationId: DispatchListAttachments
      summary: List file attachments
      description: Returns all file attachments associated with the dispatch.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Dispatch]
      operationId: DispatchUploadAttachment
      summary: Upload a file attachment
      description: Uploads a file and attaches it to the dispatch. Supports multipart/form-data.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                description:
                  type: string
                  description: Optional description of the attachment
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dispatches/{id}/attachments/{att_id}:
    delete:
      tags: [Dispatch]
      operationId: DispatchDeleteAttachment
      summary: Remove a file attachment
      description: Permanently deletes the specified attachment from the dispatch.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - $ref: '#/components/parameters/AttachmentID'
      responses:
        '204':
          description: Attachment deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Workflow ──────────────────────────────────────────────────────────────────

  /dispatches/{id}/minute-sheet:
    get:
      tags: [Workflow]
      operationId: WorkflowGetMinuteSheet
      summary: Get minute sheet and green note timeline
      description: |
        Returns the minute sheet for the dispatch along with the full ordered list
        of green notes. Use this as the primary view for the Green Noting Canvas.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Minute sheet with embedded green notes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinuteSheet' }
              example:
                id: "ms-uuid-0001"
                organizationId: "org-uuid-0001"
                dispatchId: "dispatch-uuid-0001"
                status: OPEN
                approvedById: null
                approvedAt: null
                createdAt: "2026-06-01T08:00:00Z"
                updatedAt: "2026-06-01T10:00:00Z"
                notes: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dispatches/{id}/green-notes:
    get:
      tags: [Workflow]
      operationId: WorkflowListGreenNotes
      summary: List green notes in sequence order
      description: Returns all green notes for the dispatch's minute sheet, ordered by sequenceOrder ascending.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Ordered list of green notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GreenNote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Workflow]
      operationId: WorkflowGreenNoteAppend
      summary: Append a green note to a minute sheet
      description: |
        Appends a new green note to the dispatch's minute sheet.

        **Hash chain enforcement:** The `previousHash` field must equal the
        `cryptographicHash` of the most recent note in the sheet. If it does not match,
        the server rejects the request with `409 Conflict` — this indicates either a
        concurrent write race or an attempt to tamper with the chain.

        Notes are **immutable after insert**. There is no update or delete endpoint.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendGreenNoteRequest' }
            example:
              contentBody: "Document reviewed. No issues found. Forwarding to department head for approval."
              previousHash: "a3f8c2d1e5b6f7a8..."
      responses:
        '201':
          description: Green note appended successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GreenNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Hash chain mismatch — previousHash does not match the last note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "hash chain broken: previousHash does not match last note" }
        '500': { $ref: '#/components/responses/InternalError' }

  /dispatches/{id}/minute-sheet/approve:
    post:
      tags: [Workflow]
      operationId: WorkflowApproveMinuteSheet
      summary: Approve the minute sheet
      description: |
        Marks the minute sheet as approved. Sets `approvedById` and `approvedAt`.
        Once approved, the minute sheet is closed — no further green notes can be appended.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Minute sheet approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinuteSheet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Minute sheet is already approved or rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "minute sheet is already approved" }

  # ── Governance ────────────────────────────────────────────────────────────────

  /audit-log:
    get:
      tags: [Governance]
      operationId: GovernanceQueryAuditLog
      summary: Query the audit ledger
      description: |
        Returns audit log entries filtered by date range. Results are paginated and ordered
        by `createdAt` descending. Requires `SYS_ADMIN` role.
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: eventType
          in: query
          schema: { $ref: '#/components/schemas/AuditEventType' }
          description: Filter by specific event type
      responses:
        '200':
          description: Paginated audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit-log/verify:
    get:
      tags: [Governance]
      operationId: GovernanceVerifyChain
      summary: Verify the checksum chain
      description: |
        Walks all audit log entries in the specified date range and verifies that each
        row's `previousChecksum` matches the checksum of the preceding row.
        Returns a detailed result including any broken links found.
        Requires `SYS_ADMIN` role.
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Chain verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChainVerificationResult' }
              example:
                valid: true
                totalRows: 1482
                brokenAt: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

