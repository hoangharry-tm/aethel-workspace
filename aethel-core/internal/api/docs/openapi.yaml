        '200':
          description: Server is alive
          content:
            text/plain:
              schema: { type: string }
              example: "ok"

  /readyz:
    get:
      tags: [System]
      operationId: SystemReadyz
      summary: Readiness probe
      description: Returns 200 if the server is ready to serve traffic (database reachable).
      security: []
      responses:
        '200':
          description: Server is ready
          content:
            text/plain:
              schema: { type: string }
              example: "ready"
        '503':
          description: Server not ready (database unreachable)
          content:
            text/plain:
              schema: { type: string }
              example: "db not ready"

# ── Components ────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token from `POST /api/v1/auth/login`.
        Claims: `sub` (user UUID), `role`, `iat`, `exp`, `jti`.
        Expiry: 15 minutes. Use the refresh endpoint to renew.

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentID:
      name: att_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    DateFrom:
      name: from
      in: query
      schema: { type: string, format: date }
      description: Start of date range (inclusive), ISO 8601 date
    DateTo:
      name: to
      in: query
      schema: { type: string, format: date }
      description: End of date range (exclusive), ISO 8601 date

  responses:
    BadRequest:
      description: Bad request — invalid JSON or missing required field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "invalid request body" }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "unauthorized" }
    Forbidden:
      description: Authenticated but insufficient role or permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "forbidden" }
    Locked:
      description: Account temporarily locked due to too many failed login attempts
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "account temporarily locked due to too many failed attempts" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "not found" }
    UnprocessableEntity:
      description: Validation error — request is well-formed but semantically invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example: { error: "email is not a valid email address", field: "email" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "rate limit exceeded" }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "internal server error" }

  schemas:
    # ── Errors ────────────────────────────────────────────────────────────────

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    ValidationError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        field: { type: string }

    # ── Enumerations ──────────────────────────────────────────────────────────

    UserRole:
      type: string
      enum: [ADMIN, RECEPTION, USER, SYS_ADMIN]

    PriorityLevel:
      type: string
      enum: [ROUTINE, PRIORITY, IMMEDIATE]

    DispatchStatus:
      type: string
      enum: [PENDING_ASSIGNMENT, UNDER_REVIEW, IN_TRANSIT, ATTEMPTED_DELIVERY, DELIVERED, ESCALATED, DISPATCHED, REJECTED]

    DispatchDirection:
      type: string
      enum: [INBOUND, OUTBOUND]

    MatchOperator:
      type: string
      enum: [EQUALS, CONTAINS, STARTS_WITH, REGEX]

    ConditionType:
      type: string
      enum: [DOCUMENT_TYPE, SENDER_NAME, SENDER_ORG, URGENCY_LEVEL]

    NotificationType:
      type: string
      enum: [DOCUMENT_ARRIVAL, REMINDER, ESCALATION, SYSTEM]

    AuditEventType:
      type: string
      enum:
        - USER_LOGIN
        - USER_LOGIN_FAILED
        - USER_LOGOUT
        - SESSION_REVOKED
        - PERMISSION_DENIED
        - RBAC_ELEVATION_ATTEMPT
        - SECURITY_BREACH_ATTEMPT
        - UNAUTHORIZED_ACCESS_BYPASSED
        - DISPATCH_CREATED
        - DISPATCH_ASSIGNED
        - DISPATCH_DELIVERED
        - GREEN_NOTE_APPENDED
        - ADMIN_USER_CREATED
        - ADMIN_USER_DEACTIVATED
        - ADMIN_SETTINGS_CHANGED
        - ROUTING_RULE_MODIFIED

    MinuteSheetStatus:
      type: string
      enum: [OPEN, APPROVED, REJECTED]

    # ── Pagination ────────────────────────────────────────────────────────────

    PaginatedResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items: {}
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    # ── Domain Objects ────────────────────────────────────────────────────────

    User:
      type: object
      required: [id, organizationId, emailAddress, fullName, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        departmentId:
          type: string
          format: uuid
          nullable: true
        emailAddress: { type: string, format: email }
        fullName: { type: string }
        jobTitle:
          type: string
          nullable: true
        role: { $ref: '#/components/schemas/UserRole' }
        isActive: { type: boolean }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserSummary:
      type: object
      required: [id, fullName, emailAddress, role]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        emailAddress: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        departmentId:
          type: string
          format: uuid
          nullable: true

    Dispatch:
      type: object
      required: [id, organizationId, trackingNumber, direction, documentTypeId, senderName, submittedByUserId, priorityLevel, statusState, isManuallyRouted, isEscalated, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        trackingNumber: { type: string }
        direction: { $ref: '#/components/schemas/DispatchDirection' }
        documentTypeId: { type: string, format: uuid }
        senderName: { type: string }
        senderOrganization:
          type: string
          nullable: true
        recipientName:
          type: string
          nullable: true
        recipientOrganization:
          type: string
          nullable: true
        recipientAddress:
          type: string
          nullable: true
        assignedUserId:
          type: string
          format: uuid
          nullable: true
        assignedDepartmentId:
          type: string
          format: uuid
          nullable: true
        submittedByUserId: { type: string, format: uuid }
        priorityLevel: { $ref: '#/components/schemas/PriorityLevel' }
        statusState: { $ref: '#/components/schemas/DispatchStatus' }
        subjectLine:
          type: string
          nullable: true
        deliveryMode:
          type: string
          nullable: true
        isManuallyRouted: { type: boolean }
        originalSuggestedUserId:
          type: string
          format: uuid
          nullable: true
        overdueAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedByUserId:
          type: string
          format: uuid
          nullable: true
        isEscalated: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DispatchSummary:
      type: object
      required: [id, trackingNumber, direction, senderName, priorityLevel, statusState, createdAt]
      properties:
        id: { type: string, format: uuid }
        trackingNumber: { type: string }
        direction: { $ref: '#/components/schemas/DispatchDirection' }
        senderName: { type: string }
        priorityLevel: { $ref: '#/components/schemas/PriorityLevel' }
        statusState: { $ref: '#/components/schemas/DispatchStatus' }
        createdAt: { type: string, format: date-time }

    DispatchEvent:
      type: object
      required: [id, organizationId, dispatchId, eventType, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        dispatchId: { type: string, format: uuid }
        eventType: { type: string }
        actorUserId:
          type: string
          format: uuid
          nullable: true
        fromUserId:
          type: string
          format: uuid
          nullable: true
        toUserId:
          type: string
          format: uuid
          nullable: true
        fromDeptId:
          type: string
          format: uuid
          nullable: true
        toDeptId:
          type: string
          format: uuid
          nullable: true
        metadata:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }

    DocumentType:
      type: object
      required: [id, organizationId, name, code, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        description:
          type: string
          nullable: true
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MinuteSheet:
      type: object
      required: [id, organizationId, dispatchId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        dispatchId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/MinuteSheetStatus' }
        approvedById:
          type: string
          format: uuid
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        notes:
          type: array
          items: { $ref: '#/components/schemas/GreenNote' }

    GreenNote:
      type: object
      required: [id, organizationId, minuteSheetId, authorOfficerId, sequenceOrder, contentBody, cryptographicHash, previousHash, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        minuteSheetId: { type: string, format: uuid }
        authorOfficerId: { type: string, format: uuid }
        sequenceOrder: { type: integer }
        contentBody: { type: string }
        cryptographicHash: { type: string, description: SHA-256 hash of contentBody + sequenceOrder + authorOfficerId }
        previousHash: { type: string, description: cryptographicHash of the preceding note (empty string for the first note) }
        digitalSignature:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }

    AuditEntry:
      type: object
      required: [id, organizationId, actionEventType, previousChecksum, checksum, createdAt]
      properties:
        id: { type: integer, format: int64 }
        organizationId: { type: string, format: uuid }
        actorUserId:
          type: string
          format: uuid
          nullable: true
        actionEventType: { $ref: '#/components/schemas/AuditEventType' }
        targetResourceId:
          type: string
          format: uuid
          nullable: true
        targetTable:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        metadata:
          type: string
          nullable: true
        previousChecksum: { type: string }
        checksum: { type: string }
        createdAt: { type: string, format: date-time }

    RoutingRule:
      type: object
      required: [id, organizationId, name, priorityOrder, isActive, conditions, destinations, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        priorityOrder: { type: integer }
        isActive: { type: boolean }
        conditions:
          type: array
          items: { $ref: '#/components/schemas/RoutingRuleCondition' }
        destinations:
          type: array
          items: { $ref: '#/components/schemas/RoutingRuleDestination' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RoutingRuleCondition:
      type: object
      required: [id, routingRuleId, fieldName, operator, matchValue]
      properties:
        id: { type: string, format: uuid }
        routingRuleId: { type: string, format: uuid }
        fieldName: { type: string }
        operator: { type: string }
        matchValue: { type: string }

    RoutingRuleDestination:
      type: object
      required: [id, routingRuleId, priorityOffset]
      properties:
        id: { type: string, format: uuid }
        routingRuleId: { type: string, format: uuid }
        departmentId:
          type: string
          format: uuid
          nullable: true
        userId:
          type: string
          format: uuid
          nullable: true
        priorityOffset: { type: integer }

    EscalationRule:
      type: object
      required: [id, organizationId, name, escalateAfterHours, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        documentTypeId:
          type: string
          format: uuid
          nullable: true
        priorityLevel:
          type: string
          nullable: true
        escalateAfterHours: { type: integer }
        notifyUserId:
          type: string
          format: uuid
          nullable: true
        notifyDepartmentId:
          type: string
          format: uuid
          nullable: true
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, type, title, isRead, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        body:
          type: string
          nullable: true
        dispatchId:
          type: string
          format: uuid
          nullable: true
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    Attachment:
      type: object
      required: [id, dispatchId, fileName, fileSize, mimeType, createdAt]
      properties:
        id: { type: string, format: uuid }
        dispatchId: { type: string, format: uuid }
        fileName: { type: string }
        fileSize: { type: integer, description: File size in bytes }
        mimeType: { type: string }
        description:
          type: string
          nullable: true
        uploadedByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    AppConfig:
      type: object
      required: [branding, nav, features, org]
      properties:
        branding: { $ref: '#/components/schemas/BrandingConfig' }
        nav:
          type: array
          items: { $ref: '#/components/schemas/NavGroup' }
        features: { $ref: '#/components/schemas/FeatureFlags' }
        org: { $ref: '#/components/schemas/OrgProfile' }

    BrandingConfig:
      type: object
      required: [primaryColor, neutralPalette, fontFamily, wordmark]
      properties:
        primaryColor: { type: string, description: 'CSS hex color, e.g. "#4f46e5"' }
        neutralPalette: { type: string, description: 'Tailwind palette name, e.g. "slate"' }
        fontFamily: { type: string, description: 'Font family name, e.g. "Inter"' }
        logoUrl:
          type: string
          nullable: true
          description: URL to the organization logo image
        wordmark: { type: string, description: Text wordmark displayed in the sidebar }

    NavGroup:
      type: object
      required: [label, roles, items]
      properties:
        label: { type: string }
        roles:
          type: array
          items: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/NavItem' }

    NavItem:
      type: object
      required: [label, icon, to]
      properties:
        label: { type: string }
        icon: { type: string, description: 'Iconify icon name, e.g. "i-lucide-inbox"' }
        to: { type: string, description: Route path or URL }
        badge:
          type: integer
          nullable: true

    FeatureFlags:
      type: object
      required: [greenNotingEnabled, externalSmtpEnabled, require2faForAdmin]
      properties:
        greenNotingEnabled: { type: boolean }
        externalSmtpEnabled: { type: boolean }
        require2faForAdmin: { type: boolean }

    OrgProfile:
      type: object
      required: [name, timezone, locale, contactEmail]
      properties:
        name: { type: string }
        timezone: { type: string, description: 'IANA timezone string, e.g. "Asia/Ho_Chi_Minh"' }
        locale: { type: string, description: 'BCP 47 locale tag, e.g. "vi-VN"' }
        contactEmail: { type: string, format: email }

    ChainVerificationResult:
      type: object
      required: [valid, totalRows]
      properties:
        valid: { type: boolean }
        totalRows: { type: integer }
        brokenAt:
          type: array
          items: { $ref: '#/components/schemas/BrokenLink' }

    BrokenLink:
      type: object
      required: [entryId, computedChecksum, storedChecksum, createdAt]
      properties:
        entryId: { type: integer, format: int64 }
        computedChecksum: { type: string }
        storedChecksum: { type: string }
        createdAt: { type: string, format: date-time }

    ReportSummary:
      type: object
      required: [totalDispatches, byStatus, byPriority]
      properties:
        totalDispatches: { type: integer }
        byStatus:
          type: object
          additionalProperties: { type: integer }
        byPriority:
          type: object
          additionalProperties: { type: integer }
        avgProcessingHours:
          type: number
          format: float
          nullable: true

    # ── Request Bodies ────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }

    CreateDispatchRequest:
      type: object
      required: [direction, documentTypeId, senderName, priorityLevel]
      properties:
        direction: { $ref: '#/components/schemas/DispatchDirection' }
        documentTypeId: { type: string, format: uuid }
        senderName: { type: string }
        senderOrganization: { type: string, nullable: true }
        recipientName: { type: string, nullable: true }
        recipientOrganization: { type: string, nullable: true }
        recipientAddress: { type: string, nullable: true }
        priorityLevel: { $ref: '#/components/schemas/PriorityLevel' }
        subjectLine: { type: string, nullable: true }
        deliveryMode: { type: string, nullable: true }

    AssignDispatchRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          nullable: true
        departmentId:
          type: string
          format: uuid
          nullable: true
        isManualOverride: { type: boolean, default: false }

    AppendGreenNoteRequest:
      type: object
      required: [contentBody, previousHash]
      properties:
        contentBody: { type: string, minLength: 1 }
        previousHash: { type: string, description: cryptographicHash of the last note; empty string for the first note }

    CreateUserRequest:
      type: object
      required: [email, fullName, role, password]
      properties:
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        departmentId:
          type: string
          format: uuid
          nullable: true
        password: { type: string, minLength: 8 }

    PatchBrandingRequest:
      type: object
      properties:
        primaryColor: { type: string }
        neutralPalette: { type: string }
        fontFamily: { type: string }
        wordmark: { type: string }
        logoUrl: { type: string, nullable: true }

    PatchNavRequest:
      type: object
      required: [nav]
      properties:
        nav:
          type: array
          items: { $ref: '#/components/schemas/NavGroup' }

    PatchFeaturesRequest:
      type: object
      properties:
        greenNotingEnabled: { type: boolean }
        externalSmtpEnabled: { type: boolean }
        require2faForAdmin: { type: boolean }

    PatchOrgRequest:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        locale: { type: string }
        contactEmail: { type: string, format: email }

    CreateRoutingRuleRequest:
      type: object
      required: [name, priorityOrder, isActive, conditions, destinations]
      properties:
        name: { type: string }
        priorityOrder: { type: integer, minimum: 1 }
        isActive: { type: boolean }
        conditions:
          type: array
          items:
            type: object
            required: [fieldName, operator, matchValue]
            properties:
              fieldName: { type: string }
              operator: { type: string }
              matchValue: { type: string }
        destinations:
          type: array
          items:
            type: object
            required: [priorityOffset]
            properties:
              userId:
                type: string
                format: uuid
                nullable: true
              departmentId:
                type: string
                format: uuid
                nullable: true
              priorityOffset: { type: integer }

    CreateEscalationRuleRequest:
      type: object
      required: [name, escalateAfterHours, isActive]
      properties:
        name: { type: string }
        documentTypeId:
          type: string
          format: uuid
          nullable: true
        priorityLevel:
          type: string
          nullable: true
        escalateAfterHours: { type: integer, minimum: 1 }
        notifyUserId:
          type: string
          format: uuid
          nullable: true
        notifyDepartmentId:
          type: string
          format: uuid
          nullable: true
        isActive: { type: boolean }
